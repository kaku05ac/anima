  /* Layout: hero = looping painting (full screen). Below it, an ivory timeline section where
     three gradient ribbons flow from one origin on the left into long horizontal paths. */
  :root {
    --sky: #74a4e0;
    --ivory: #fff8f5;
    --ink: #2f2c2a;
    --ink-soft: #6f6863;
    --pill: #353433;
    --f1: #ffc74e; --f2: #ffbf63; --f3: #feb77e;   /* Filozofia: gold to peach */
    --p1: #f77764; --p2: #fe9242;                  /* Pismo: coral to orange */
    --m1: #935d99; --m2: #8972b3; --m3: #7c8dd7;   /* Kościół: plum to periwinkle */
    --nav1: #f6c9cf; --nav2: #fbd9b5; --nav3: #fbf0dc;
    --font-ui: "Alegreya Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --font-hand: "Kalam", "Segoe Print", "Comic Sans MS", cursive;
    color-scheme: light;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { background: var(--sky); height: 100%; }
  body { margin: 0; color: var(--ink); font-family: var(--font-ui); overflow: hidden; }

  /* ===== Hero: the painting ===== */
  :root { --scene-scale: 1; --scene-x: 0.5; --scene-y: 0.5; }
  .hero { position: fixed; inset: 0; overflow: hidden; background: var(--sky); }
  .hero::before {
    content: ""; position: absolute; inset: -40px;
    background: url("images/background-poster.webp") no-repeat center / cover; filter: blur(18px);
  }
  .scene {
    --cover-w: max(100vw, 100vh * 1920 / 1200);
    position: absolute; width: calc(var(--cover-w) * var(--scene-scale)); aspect-ratio: 1920 / 1200;
    left: calc((100vw - var(--cover-w) * var(--scene-scale)) * var(--scene-x));
    top: calc((100vh - var(--cover-w) * var(--scene-scale) * 1200 / 1920) * var(--scene-y));
    display: block; object-fit: cover;
  }
  @media (max-aspect-ratio: 1/1) { :root { --scene-x: 0.1; } }
  .scroll-cue {
    position: absolute; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
    width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
    color: #fff; background: rgba(30, 30, 50, 0.25); text-decoration: none;
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }
  .scroll-cue:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

  /* ===== Timeline ===== */
  .tl {
    position: fixed; inset: 0; overflow: hidden;
    background: transparent; touch-action: pan-y;
    cursor: default; outline: none;
  }
  .tl.dragging { cursor: grabbing; }
  .tl:focus-visible { box-shadow: inset 0 0 0 2px rgba(255,255,255,.7); }
  .tl svg.art { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  /* strands: one hairline per entry, from the soul point out to its dot (Giga-style bundles) */
  .centerline { fill: none; stroke: #fff; stroke-opacity: 0.95; stroke-width: 1.3; }
  .strand { fill: none; stroke: #fff; stroke-opacity: 0.85; stroke-width: 1.1; transition: stroke-opacity .25s, stroke-width .25s; }
  .strand.ghost { stroke-opacity: 0.25; }
  .strand.hl { stroke-opacity: 1; stroke-width: 2.3; }
  .pulse { fill: none; stroke: #fffaf0; stroke-width: 1.6; stroke-linecap: round; stroke-opacity: 0.95; }
  .soulpoint { fill: #fff; }
  .deco circle, .deco line { vector-effect: non-scaling-stroke; }

  .years { position: absolute; left: 0; right: 0; top: 0; pointer-events: none; }
  .year {
    position: absolute; top: 0; color: #fff; white-space: nowrap;
    font-family: "Geist Pixel Line", "Geist Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    font-weight: 400; font-style: normal !important; font-size: clamp(15px, 1.2vw, 19px); line-height: 1; letter-spacing: 0.01em;
    font-variant-numeric: tabular-nums;
  }
  .year small { display: block; font-size: 0.26em; font-weight: 500; font-style: normal; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(255,255,255,.9); margin-top: 4px; }
  /* index strip at the bottom: hairline rules, a header row and the entry in focus */
  .index { position: absolute; z-index: 3; color: #fff; pointer-events: none;
    font-family: "Geist", "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; font-weight: 300;
    font-size: calc(clamp(9px, 0.71vw, 11.25px) - 1px); line-height: 1.2; }
  /* one column grid for the whole strip; both rows use it (subgrid), so columns always line up */
  .index { display: grid; grid-template-columns: 4.5em minmax(0, 1.3fr) minmax(0, 0.7fr) minmax(0, 2.2fr) 13em; column-gap: 2em; }
  .ix-row { grid-column: 1 / -1; display: grid; grid-template-columns: subgrid;
    align-items: baseline; padding: 0.55em 0; border-top: 1px solid rgba(255, 255, 255, 0.4); }
  @supports not (grid-template-columns: subgrid) {
    .ix-row { grid-template-columns: 4.5em minmax(0, 1.3fr) minmax(0, 0.7fr) minmax(0, 2.2fr) 13em; column-gap: 2em; }
  }
  .ix-row:last-child { border-bottom: 1px solid rgba(255, 255, 255, 0.4); }
  .ix-row > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ix-row > span:last-child { text-align: right; }
  .ix-head { opacity: 0.72; }
  .ix-row .tag { color: #f3e39a; margin-left: 0.7em; }
  #ixRow { transition: opacity .14s ease-out; }
  #ixRow.fading { opacity: 0; }
  .brand { position: absolute; color: #fff; pointer-events: none; white-space: nowrap;
    font-family: "Geist Pixel Line", "Geist Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    font-size: calc(clamp(15px, 1.25vw, 20px) - 8px); font-weight: 400; line-height: 1; letter-spacing: 0.01em; }
  .startline { position: absolute; width: 1px; background: var(--ink); pointer-events: none; }

  .cat {
    position: absolute; transform: translateY(-50%); text-align: right; pointer-events: none;
    font-family: "Geist Mono", ui-monospace, "SFMono-Regular", Menlo, monospace; font-size: 12px; font-weight: 400; letter-spacing: 0.02em; text-transform: lowercase; line-height: 1.2; color: #fff; text-shadow: 0 1px 2px rgba(20, 24, 60, 0.7), 0 0 12px rgba(20, 30, 70, 0.5);
  }
  .cat em { display: block; font-style: normal; margin-bottom: 3px; }
  .cat span { display: block; font: inherit; font-size: 9.5px; color: #fff; }

  .markers { position: absolute; inset: 0; pointer-events: none; }
  .mk {
    position: absolute; pointer-events: auto; border: 0; padding: 0; cursor: pointer;
    transform: translate(-50%, -50%); transition: left .32s cubic-bezier(.3, 0, .2, 1);
    font-family: var(--font-ui); -webkit-tap-highlight-color: transparent;
  }
  .tl.dragging .mk { transition: none; }
  /* markers in the slider style: square, thin, frosted */
  /* entries: slim vertical ticks across the line, like the slider's ticks */
  .mk.dot { width: 14px; height: 13px; background: transparent; }
  .mk.dot::before {
    content: ""; position: absolute; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px 0 0 -2px;
    border-radius: 1px; background: var(--c, #fff); opacity: 1; transition: width .18s ease, height .18s ease, margin .18s ease, opacity .18s;
  }
  .mk.dot:hover::before, .mk.dot:focus-visible::before, .mk.dot.on::before { width: 8px; height: 8px; margin: -4px 0 0 -4px; opacity: 1; border-radius: 2px; }
  .mk.dot.ping::before { animation: ping .6s ease-out; }
  @keyframes ping { 40% { width: 8px; height: 8px; margin: -4px 0 0 -4px; opacity: 1; } }
  .mk.dot:hover, .mk.dot:focus-visible { z-index: 2; }
  .mk.cluster {
    min-width: 26px; height: 22px; padding: 0 7px; border-radius: 0;
    background: rgba(255, 255, 255, 0.06); box-shadow: inset 0 0 0 1px #fff !important;
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    color: #fff; font-family: "Geist Mono", ui-monospace, "SFMono-Regular", Menlo, monospace; font-weight: 500; font-size: 11px; line-height: 22px;
    font-variant-numeric: tabular-nums;
    transition: left .32s cubic-bezier(.3, 0, .2, 1), background .2s, color .2s;
  }
  .mk.cluster:hover, .mk.cluster:focus-visible { background: rgba(255, 255, 255, 0.28); color: #fff; }
  .mk:focus-visible { outline: 1px solid #fff; outline-offset: 3px; border-radius: 0; }
  .mk.enter { animation: fadein .3s ease-out both; }
  @keyframes fadein { from { opacity: 0; } }

  /* hover label in the slider style: square, frosted, fine white outline, mono text */
  .pill {
    position: absolute; transform: translate(-50%, -100%); pointer-events: none; z-index: 4;
    display: flex; flex-direction: column; justify-content: center; gap: 2px;
    padding: 6px 10px; border-radius: 0; color: #fff;
    background: rgba(30, 45, 85, 0.26); box-shadow: none;
    -webkit-backdrop-filter: blur(14px) saturate(1.2); backdrop-filter: blur(14px) saturate(1.2);
    white-space: nowrap; max-width: calc(100vw - 32px);
    font-family: "Geist Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    animation: pillin .14s ease-out both;
  }
  .pill b { font-size: 11px; font-weight: 400; overflow: hidden; text-overflow: ellipsis; }
  .pill i { font-size: 10px; font-style: normal; opacity: .95; overflow: hidden; text-overflow: ellipsis; }
  @keyframes pillin { from { opacity: 0; } }

    '<p>Każda cienka linia wychodzi z jednego punktu i kończy się kropką: to jedna osoba albo jeden dokument z jedną tezą. Wpisy bliskie w czasie układają się w pionowe kolumny. Suwak na dole wybiera okres, który widać na ścieżkach.</p>' +
    '<div class="kicker" style="margin-top:8px">Pięć pytań, które prowadzą przez oś</div>' +
    '<ul class="qs"><li>Czym jest dusza?</li><li>Czy jest odrębna od ciała?</li><li>Czy jest nieśmiertelna?</li><li>Czy jest materialna?</li><li>Czy „ja” w ogóle istnieje?</li></ul>';
  var SOURCES = '<div class="kicker">Źródła</div><h2>Skąd pochodzą wpisy</h2>' +
    '<p>Większość wpisów pochodzi z notatek z wykładów (historia filozofii, etyka, metafizyka, teoria poznania). Oznaczone są jako <b>wykład</b>.</p>' +
    '<p>Wpisy spoza wykładów sprawdzono w źródłach zewnętrznych: <b>✅</b> potwierdzone, <b>⚠️</b> potwierdzone z korektą albo sporne w literaturze.</p>' +
    '<p>Daty osób są przybliżone. Teksty o spornym datowaniu (orfizm, Rdz 2,7, Mt 10,28) nie stoją na osi.</p>';
  function openText(html) { openPanel('<div class="band" style="background:linear-gradient(90deg,' + col('--f1') + ',' + col('--p1') + ',' + col('--m2') + ')"></div>' + html); }
  ['navAbout', 'footAbout'].forEach(function (id) { document.getElementById(id).addEventListener('click', function () { openText(ABOUT); }); });
  ['navSources', 'footSources'].forEach(function (id) { document.getElementById(id).addEventListener('click', function () { openText(SOURCES); }); });

  function full() { geometry(); drawArt(); render(); }
  var vid = document.querySelector('.scene'); if (vid) vid.addEventListener('loadedmetadata', function () { full(); });
  window.addEventListener('resize', function () { full(); });
  // ---- rolling word: starts from 00000; one position at a time counts a, b, c... up to its letter, then the next ----
  (function () {
    var el = document.getElementById('roller'), ABC = 'abcdefghijklmnopqrstuvwxyz', STEP = 45;
    var calmR = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var chars = ['0', '0', '0', '0', '0'];
    function paint() { el.innerHTML = chars.map(function (c) { return '<span class="cell">' + c + '</span>'; }).join(''); }
    if (calmR) { chars = 'anima'.split(''); paint(); return; }
    paint();
    var words = ['dusza', 'anima'], w = 0;
    function spell(word, done) {
      el.setAttribute('aria-label', word);
      var pos = 0, k = 0;
      setTimeout(function tick() {
        if (pos >= word.length) { done(); return; }
        chars[pos] = ABC[k]; paint();
        if (ABC[k] === word[pos]) { pos++; k = 0; setTimeout(tick, STEP * 4); }   // small pause when a letter lands
        else { k++; setTimeout(tick, STEP); }
      }, 900);   // zeros stay on screen for a moment before counting starts
    }
    // the reverse: one position at a time, its letter counts back (d, c, b, a) and turns into 0
    function unspell(done) {
      var pos = 0;
      (function tick() {
        if (pos >= chars.length) { done(); return; }
        var i = ABC.indexOf(chars[pos]);
        if (i > 0) { chars[pos] = ABC[i - 1]; paint(); setTimeout(tick, STEP); }
        else { chars[pos] = '0'; paint(); pos++; setTimeout(tick, STEP * 4); }   // same small pause when a 0 lands
      })();
    }
    function next() {
      var word = words[w]; w = (w + 1) % words.length;
      // spell it, hold it, count it back to 00000, then the next word starts from those zeros
      spell(word, function () { setTimeout(function () { unspell(next); }, 3200); });
    }
    setTimeout(next, 500);
  })();

  full();
  // ---- intro: Enter (or a click on "enter") clears the blur and sends the word to its corner ----
  (function () {
    var intro = document.getElementById('intro'), rl = document.getElementById('roller'), btn = document.getElementById('enterBtn'), done = false;
    try { btn.focus({ preventScroll: true }); } catch (e) {}
    function reveal() {
      if (done) return; done = true;
      // no flight: the centre word fades out with the blur, then fades in at its corner (same soft fade as "enter")
      var calmI = mq && mq.matches;
      if (calmI) rl.classList.remove('centered');
      else {
        rl.classList.add('flying');
        var out = rl.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 450, easing: 'ease-out', fill: 'forwards' });
        out.onfinish = function () {
          rl.classList.remove('centered', 'flying');
          rl.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 1000, easing: 'ease-out', fill: 'forwards' });
          out.cancel();
        };
        btn.animate([{ opacity: getComputedStyle(btn).opacity }, { opacity: 0 }], { duration: 450, easing: 'ease-out', fill: 'forwards' });
      }
      intro.classList.add('gone');
      setTimeout(function () { intro.remove(); }, calmI ? 0 : 950);
      drawIn();
      if (document.activeElement) document.activeElement.blur();   // no focus frame around the page after entering
    }
    btn.addEventListener('click', reveal);
    document.addEventListener('keydown', function (e) { if (!done && e.key === 'Enter') { e.preventDefault(); reveal(); } });
  })();
  showFeature(2, false);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(full);
})();
</script>
